spring:
  application:
    name: nasdaq-assignment

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379

  autoconfigure:
    exclude:
      - org.springframework.boot.data.autoconfigure.redis.RedisAutoConfiguration
      - org.springframework.boot.data.autoconfigure.redis.RedisReactiveAutoConfiguration

  mvc:
    problemdetails:
      enabled: true

  cache:
    type: none

